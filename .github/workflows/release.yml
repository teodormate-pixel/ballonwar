name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            deps: apt
          - os: macos-latest
            name: macOS-ARM64
            deps: brew
          # GitHub retired the Intel runners, so the x86_64 macOS
          # build is cross-compiled on the ARM runner with vcpkg
          - os: macos-latest
            name: macOS-Intel
            deps: vcpkg
            triplet: x64-osx
            host_triplet: arm64-osx
            osx_arch: x86_64
          - os: windows-latest
            name: Windows
            deps: vcpkg
            triplet: x64-windows-static

    steps:
      - uses: actions/checkout@v4

      # Linux: GLFW comes from the vendored third_party library
      # (bundled into the package); only OpenSSL and the X11/GL
      # headers are needed from the system
      - name: Dependencies (Linux)
        if: matrix.deps == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      # macOS ARM: Homebrew GLFW/OpenSSL; dylibbundler copies the
      # dynamic libraries next to the binaries before packaging
      - name: Dependencies (macOS, Homebrew)
        if: matrix.deps == 'brew'
        run: brew install glfw openssl@3 dylibbundler

      # vcpkg: static GLFW/OpenSSL for Windows and for the Intel
      # macOS cross-build
      - name: Dependencies (vcpkg)
        if: matrix.deps == 'vcpkg'
        shell: bash
        run: |
          echo "VCPKG_TOOLCHAIN=-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> "$GITHUB_ENV"
          echo "VCPKG_TRIPLET=-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" >> "$GITHUB_ENV"
          echo "VCPKG_MANIFEST=-DVCPKG_MANIFEST_DIR=$GITHUB_WORKSPACE -DVCPKG_INSTALLED_DIR=$GITHUB_WORKSPACE/vcpkg_installed" >> "$GITHUB_ENV"
          if [ -n "${{ matrix.host_triplet }}" ]; then
            echo "VCPKG_HOST=-DVCPKG_HOST_TRIPLET=${{ matrix.host_triplet }}" >> "$GITHUB_ENV"
          fi

      - name: Cache vcpkg
        if: matrix.deps == 'vcpkg'
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}

      # Pillow (used to downscale the terrain textures for the package)
      # goes into a venv: the runner Pythons are externally managed
      - name: Python + Pillow
        shell: bash
        run: |
          PY=python3
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; fi
          "$PY" -m venv "$RUNNER_TEMP/bwvenv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            VP="$RUNNER_TEMP/bwvenv/Scripts/python.exe"
          else
            VP="$RUNNER_TEMP/bwvenv/bin/python"
          fi
          "$VP" -m pip install --quiet --upgrade pip pillow
          echo "BW_PYTHON=$VP" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.deps }}" = "brew" ]; then
            EXTRA="-DCMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openssl@3)"
          fi
          if [ -n "${{ matrix.osx_arch }}" ]; then
            EXTRA="$EXTRA -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"
          fi
          cmake -S cpp_port -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="$BW_PYTHON" \
            $VCPKG_TOOLCHAIN $VCPKG_TRIPLET $VCPKG_HOST $VCPKG_MANIFEST $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Bundle dylibs (macOS ARM)
        if: matrix.deps == 'brew'
        shell: bash
        run: |
          mkdir -p build/lib
          for bin in balloonwar balloonwar-server; do
            if [ -f "build/$bin" ]; then
              dylibbundler -od -b -x "build/$bin" -d build/lib \
                -p @executable_path/lib || true
            fi
          done
          ls -la build/lib | head

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package
        shell: bash
        run: |
          cd build
          cpack -G ZIP -C Release
          if [ "$RUNNER_OS" = "Windows" ]; then
            # NSIS setup .exe (preinstalled on the Windows runners)
            cpack -G NSIS -C Release || echo "NSIS unavailable, ZIP only"
          fi
          cd ..
          # extract the package so the workflow artifact contains the
          # executables directly (GitHub zips artifacts anyway)
          mkdir -p dist
          cd dist && unzip -q ../build/*.zip && cd ..
          cp build/*.exe dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalloonWar-${{ matrix.name }}
          path: dist/**
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
          generate_release_notes: true
